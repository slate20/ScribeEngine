<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_metadata.title }} - Scribe Engine V2 Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='ide/static/v2_assets/v2_editor.css') }}">
</head>
<body>
    <div class="editor-container">
        <!-- Top Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <h1 class="project-title">{{ project_metadata.title }}</h1>
                <span class="project-type-badge">V2 Project</span>
            </div>
            <div class="toolbar-center">
                <button id="btn-visual-mode" class="toolbar-btn active">Visual</button>
                <button id="btn-code-mode" class="toolbar-btn">Code</button>
            </div>
            <div class="toolbar-right">
                <button id="btn-preview" class="toolbar-btn primary">▶ Preview</button>
                <button id="btn-save" class="toolbar-btn">💾 Save</button>
                <a href="/gui" class="toolbar-btn">← Back to Projects</a>
            </div>
        </div>

        <!-- Main Editor Layout (3 panels) -->
        <div class="editor-main">
            <!-- Left Panel: Project & Assets -->
            <div class="panel panel-left">
                <div class="panel-header">
                    <h3>Project</h3>
                </div>
                <div class="panel-content">
                    <div class="section">
                        <h4>Scenes</h4>
                        <div id="scene-list" class="tree-view">
                            <!-- Populated by JavaScript -->
                            <div class="loading">Loading scenes...</div>
                        </div>
                    </div>
                    <div class="section">
                        <h4>Assets</h4>
                        <div id="asset-browser" class="tree-view">
                            <!-- Populated by JavaScript -->
                            <div class="loading">No assets yet</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Panel: Scene Editor / Code View -->
            <div class="panel panel-center">
                <div class="panel-header">
                    <h3 id="current-scene-title">Select a scene to edit</h3>
                </div>
                <div class="panel-content">
                    <!-- Visual Editor Mode -->
                    <div id="visual-editor" class="editor-mode active">
                        <div class="canvas-toolbar">
                            <button id="btn-grid" class="canvas-tool-btn">Grid</button>
                            <button id="btn-snap" class="canvas-tool-btn">Snap</button>
                            <span class="separator">|</span>
                            <button id="btn-zoom-in" class="canvas-tool-btn">+</button>
                            <span id="zoom-level">100%</span>
                            <button id="btn-zoom-out" class="canvas-tool-btn">-</button>
                        </div>
                        <canvas id="scene-canvas" width="800" height="600"></canvas>
                        <div class="canvas-status">
                            <span id="mouse-pos">X: 0, Y: 0</span>
                        </div>
                    </div>

                    <!-- Code Editor Mode -->
                    <div id="code-editor" class="editor-mode">
                        <textarea id="code-textarea"></textarea>
                        <div class="code-status">
                            Python scene file - Direct editing
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Hierarchy & Inspector -->
            <div class="panel panel-right">
                <div class="panel-header">
                    <h3>Hierarchy</h3>
                </div>
                <div class="panel-content hierarchy-section">
                    <div id="sprite-hierarchy" class="tree-view">
                        <div class="empty-state">No sprites in scene</div>
                    </div>
                </div>

                <div class="panel-header">
                    <h3>Inspector</h3>
                </div>
                <div class="panel-content inspector-section">
                    <div id="property-inspector">
                        <div class="empty-state">Select a sprite to edit properties</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="status-message">Ready</span>
            <span id="preview-status" class="preview-indicator stopped">Preview: Stopped</span>
        </div>
    </div>

    <!-- Hidden data -->
    <div id="project-data" style="display: none;"
         data-project-name="{{ project_name }}"
         data-project-path="{{ project_path }}">
    </div>

    <script src="{{ url_for('static', filename='ide/static/v2_assets/v2_editor.js') }}"></script>
</body>
</html>
