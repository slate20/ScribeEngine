<!-- Save Details Fragment -->
<div class="save-details">
    <form id="save-form">
        <div class="form-group">
            <label for="save-description">Save Name:</label>
            <input type="text" id="save-description" name="save-description" class="form-control"
                   placeholder="Enter save name (optional)" maxlength="50"
                   value="{{ existing_description or '' }}"
                   oninput="updateCharCounter(this)">
            <small class="form-hint">
                <span>Name this save to easily identify it later</span>
                <span class="char-counter" id="char-counter">{{ (existing_description or '')|length }}/50</span>
            </small>
        </div>
        <input type="hidden" name="slot" value="{{ slot }}">
    </form>
    <div class="save-info">
        <p><strong>Current Location:</strong> {{ current_passage }}</p>
        <p><strong>Save Slot:</strong> {{ slot }}</p>
        {% if existing_save %}
            <p><strong>Existing Save:</strong> {{ existing_save.description or 'Untitled Save' }}</p>
            <p class="text-warning">This will overwrite your existing save.</p>
        {% endif %}
    </div>
</div>

<script>
// Enable the save button and add character counter functionality
const saveBtn = document.getElementById('confirm-save-btn');
if (saveBtn) {
    saveBtn.disabled = false;
}

function updateCharCounter(input) {
    const counter = document.getElementById('char-counter');
    if (counter) {
        const currentLength = input.value.length;
        const maxLength = input.maxLength;
        counter.textContent = `${currentLength}/${maxLength}`;

        // Add visual feedback for approaching limit
        if (currentLength > maxLength * 0.8) {
            counter.style.color = '#ff6b35';
        } else {
            counter.style.color = '';
        }
    }
}
</script>
